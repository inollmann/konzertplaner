[project]
name = "konzertplaner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "pillow>=12.3.0",
    "requests>=2.33.1",
    "werkzeug>=3.1.6",
    "sqlmodel>=0.0.16",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "playwright>=1.47",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "-ra", "-m", "not e2e"]
markers = [
    "e2e: end-to-end browser tests (Playwright, slow)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.format]
quote-style = "double"
