<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konzertplaner – Design Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --tool-bg:      #0a0a0a;
  --tool-surface: #141414;
  --tool-surface2: #1e1e1e;
  --tool-border:  #2c2c2c;
  --tool-accent:  #e8ff47;
  --tool-text:    #f0f0f0;
  --tool-muted:   #666;
}
html, body { height: 100%; background: var(--tool-bg); color: var(--tool-text);
  font-family: 'DM Sans', sans-serif; font-size: 14px; overflow: hidden; }

/* ── Inline icons (Lucide sprite, monochrome via currentColor) ── */
svg.ic {
  width: 1em; height: 1em; display: inline-block; flex-shrink: 0;
  vertical-align: -0.16em; fill: none; stroke: currentColor;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
svg.ic use { fill: inherit; }

/* ── Layout: two panels side by side ── */
.app { display: flex; height: 100vh; }

/* ── Left panel: controls ── */
.controls {
  width: 340px; min-width: 280px; max-width: 420px; flex-shrink: 0;
  background: var(--tool-surface); border-right: 1px solid var(--tool-border);
  display: flex; flex-direction: column; overflow: hidden;
}
.controls-header {
  padding: 16px 20px; border-bottom: 1px solid var(--tool-border);
  display: flex; align-items: center; justify-content: space-between;
}
.controls-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem;
  letter-spacing: 2px; color: var(--tool-accent); }
.controls-body { flex: 1; overflow-y: auto; padding: 16px 20px; }

/* ── Section ── */
.section { margin-bottom: 22px; }
.section-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--tool-muted); margin-bottom: 10px;
}

/* ── Theme presets ── */
.preset-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-bottom: 8px; }
.preset-btn {
  background: var(--tool-surface2); border: 1px solid var(--tool-border);
  border-radius: 7px; padding: 8px 6px; cursor: pointer; text-align: center;
  font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--tool-text);
  transition: border-color .2s, background .2s;
}
.preset-btn:hover { border-color: var(--tool-accent); background: rgba(232,255,71,.05); }
.preset-icon { font-size: 18px; display: block; margin-bottom: 3px; }

/* ── Color rows ── */
.color-row {
  display: flex; align-items: center; gap: 10px; padding: 6px 0;
  border-bottom: 1px solid var(--tool-border);
}
.color-row:last-child { border-bottom: none; }
.color-preview {
  width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
  border: 1px solid var(--tool-border); cursor: pointer; position: relative; overflow: hidden;
}
.color-preview input[type=color] {
  position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px);
  opacity: 0; cursor: pointer; border: none; padding: 0;
}
.color-label { flex: 1; min-width: 0; }
.color-name { font-size: 13px; }
.color-var  { font-size: 10px; color: var(--tool-muted); font-family: monospace; }
.color-hex  {
  background: var(--tool-surface2); border: 1px solid var(--tool-border);
  border-radius: 5px; color: var(--tool-text); font-family: monospace;
  font-size: 12px; padding: 4px 8px; width: 80px; outline: none;
  transition: border-color .2s;
}
.color-hex:focus { border-color: var(--tool-accent); }

/* ── Custom CSS editor ── */
.css-editor {
  background: var(--tool-surface2); border: 1px solid var(--tool-border);
  border-radius: 8px; color: var(--tool-text); font-family: 'Courier New', monospace;
  font-size: 12px; padding: 10px; width: 100%; min-height: 140px;
  resize: vertical; outline: none; line-height: 1.6;
  transition: border-color .2s;
}
.css-editor:focus { border-color: var(--tool-accent); }

/* ── Actions ── */
.actions { display: flex; flex-direction: column; gap: 8px; }
.btn {
  padding: 9px 16px; border-radius: 8px; font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
  border: none; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-primary { background: var(--tool-accent); color: #000; }
.btn-primary:hover { filter: brightness(1.1); }
.btn-secondary {
  background: none; border: 1px solid var(--tool-border); color: var(--tool-muted);
}
.btn-secondary:hover { border-color: var(--tool-text); color: var(--tool-text); }
.btn-danger { background: none; border: 1px solid #444; color: #f87171; }
.btn-danger:hover { border-color: #f87171; background: rgba(248,113,113,.08); }

/* ── Right panel: live preview ── */
.preview-panel {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
}
.preview-bar {
  padding: 10px 16px; border-bottom: 1px solid var(--tool-border);
  display: flex; align-items: center; gap: 12px; background: var(--tool-surface);
  flex-shrink: 0;
}
.preview-bar-title { font-size: 12px; color: var(--tool-muted); }
.preview-url { font-family: monospace; font-size: 11px; color: var(--tool-muted);
  background: var(--tool-surface2); border: 1px solid var(--tool-border);
  border-radius: 5px; padding: 3px 8px; }
.preview-iframe {
  flex: 1; border: none; background: #fff;
}
.preview-reload {
  background: none; border: 1px solid var(--tool-border); border-radius: 6px;
  color: var(--tool-muted); padding: 4px 10px; cursor: pointer; font-size: 12px;
  transition: all .15s;
}
.preview-reload:hover { border-color: var(--tool-text); color: var(--tool-text); }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--tool-surface); border: 1px solid var(--tool-border);
  border-radius: 8px; padding: 10px 20px; font-size: 13px;
  box-shadow: 0 4px 20px #0008; opacity: 0; transition: opacity .2s;
  pointer-events: none; white-space: nowrap;
}
.toast.visible { opacity: 1; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--tool-bg); }
::-webkit-scrollbar-thumb { background: var(--tool-border); border-radius: 3px; }
</style>
</head>
<body>

roke-linejoin="round" stroke-width="2" d="M18 5h4m-2-2v4m.985 5.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></symbol><symbol id="i-trees" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path fill="none" d="M10 10v.2A3 3 0 0 1 8.9 16H5a3 3 0 0 1-1-5.8V10a3 3 0 0 1 6 0m-3 6v6m6-3v3"/><path fill="none" d="M12 19h8.3a1 1 0 0 0 .7-1.7L18 14h.3a1 1 0 0 0 .7-1.7L16 9h.2a1 1 0 0 0 .8-1.7L13 3l-1.4 1.5"/></g></symbol><symbol id="i-flower-2" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path fill="none" d="M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v1M9 8a3 3 0 1 0 3 3M9 8h1m5 0a3 3 0 1 1-3 3m3-3h-1m-2 3v1"/><circle fill="none" cx="12" cy="8" r="2"/><path fill="none" d="M12 10v12m0 0c4.2 0 7-1.667 7-5c-4.2 0-7 1.667-7 5m0 0c-4.2 0-7-1.667-7-5c4.2 0 7 1.667 7 5"/></g></symbol><symbol id="i-gem" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path fill="none" d="M10.5 3L8 9l4 13l4-13l-2.5-6"/><path fill="none" d="M17 3a2 2 0 0 1 1.6.8l3 4a2 2 0 0 1 .013 2.382l-7.99 10.986a2 2 0 0 1-3.247 0l-7.99-10.986A2 2 0 0 1 2.4 7.8l2.998-3.997A2 2 0 0 1 7 3zM2 9h20"/></g></symbol><symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"/></symbol></svg>
<div class="app">

  <!-- ── Left: Controls ── -->
  <aside class="controls">
    <div class="controls-header">
      <span class="controls-title">Design Tool</span>
      <a href="/" style="font-size:12px;color:var(--tool-muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px" title="Zur App"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg> App</a>
    </div>
    <div class="controls-body">

      <!-- Presets -->
      <div class="section">
        <div class="section-label">Theme-Presets</div>
        <div class="preset-grid" id="preset-grid"></div>
      </div>

      <!-- Color variables -->
      <div class="section">
        <div class="section-label">Farben</div>
        <div id="color-rows"></div>
      </div>

      <!-- Custom CSS -->
      <div class="section">
        <div class="section-label">Eigenes CSS (wird in die App eingefügt)</div>
        <textarea class="css-editor" id="custom-css"
          placeholder="/* Beliebiges CSS hier einfügen */
/* Beispiel: */
.logo { letter-spacing: 6px; }
header { backdrop-filter: blur(12px); }"
          oninput="onCustomCssChange()"></textarea>
      </div>

      <!-- Actions -->
      <div class="section">
        <div class="section-label">Aktionen</div>
        <div class="actions">
          <button class="btn btn-primary" onclick="applyToApp()"><svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg> In App anwenden</button>
          <button class="btn btn-secondary" onclick="exportCss()"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg> Als CSS exportieren</button>
          <button class="btn btn-secondary" onclick="copyToClipboard()"><svg class="ic" aria-hidden="true"><use href="#i-clipboard"/></svg> CSS kopieren</button>
          <button class="btn btn-danger" onclick="resetAll()"><svg class="ic" aria-hidden="true"><use href="#i-rotate-ccw"/></svg> Alles zurücksetzen</button>
        </div>
      </div>

    </div>
  </aside>

  <!-- ── Right: Preview iframe ── -->
  <div class="preview-panel">
    <div class="preview-bar">
      <span class="preview-bar-title">Live-Vorschau</span>
      <span class="preview-url">localhost:5000</span>
      <button class="preview-reload" onclick="reloadPreview()"><svg class="ic" aria-hidden="true"><use href="#i-rotate-ccw"/></svg> Neu laden</button>
    </div>
    <iframe class="preview-iframe" id="preview-frame" src="/" title="App-Vorschau"></iframe>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
// ── Inline icon helper (references the #ic-sprite above) ──────────────
function icon(name) {
  return `<svg class="ic" aria-hidden="true"><use href="#i-${name}"/></svg>`;
}

// ── Color variable definitions (mirrors main app) ──────────────────────
const COLOR_VARS = [
  { key: '--accent',        label: 'Akzentfarbe',  group: 'Hauptfarben' },
  { key: '--tour',          label: 'Tour-Farbe',   group: 'Hauptfarben' },
  { key: '--festival',      label: 'Festival-Farbe', group: 'Hauptfarben' },
  { key: '--tickets-color', label: 'Tickets-Tag',  group: 'Tags' },
  { key: '--watch-color',   label: 'Merkliste-Tag', group: 'Tags' },
  { key: '--danger',        label: 'Gefahr/Löschen', group: 'Hauptfarben' },
  { key: '--link',          label: 'Link',         group: 'Hauptfarben' },
  { key: '--link-soldout',  label: 'Link (ausverkauft)', group: 'Hauptfarben' },
  { key: '--bg',            label: 'Hintergrund',  group: 'Oberfläche' },
  { key: '--surface',       label: 'Karte / Panel', group: 'Oberfläche' },
  { key: '--surface2',      label: 'Eingabe / Hover', group: 'Oberfläche' },
  { key: '--surface3',      label: 'Subtil',       group: 'Oberfläche' },
  { key: '--text',          label: 'Text',         group: 'Typografie' },
  { key: '--muted',         label: 'Gedämpft',     group: 'Typografie' },
  { key: '--border',        label: 'Rahmen',       group: 'Oberfläche' },
  { key: '--placeholder',   label: 'Platzhalter',   group: 'Typografie' },
];

const THEMES = {
  dark: {
    icon: 'moon', label: 'Dark', description: 'Standard',
    vars: { '--bg':'#0d0d0d','--surface':'#161616','--surface2':'#1f1f1f',
      '--surface3':'#272727','--border':'#2e2e2e44','--text':'#f0f0f0',
      '--muted':'#777','--accent':'#e8ff47','--tour':'#19c6e6',
      '--festival':'#ff4d8d','--tickets-color':'#1fc8a4','--watch-color':'#ff9e2c',
      '--danger':'#f87171','--link':'#99aecc','--link-soldout':'#64748b',
      '--placeholder':'#444' },
  },
  light: {
    icon: 'sun', label: 'Light', description: 'Hell',
    vars: { '--bg':'#ececec','--surface':'#ffffff','--surface2':'#f3f3f3',
      '--surface3':'#e5e5e5','--border':'#dddddddd','--text':'#1a1a1a',
      '--muted':'#666','--accent':'#006b66','--tour':'#0e7c9c',
      '--festival':'#c8286a','--tickets-color':'#0a7a5e','--watch-color':'#b8650a',
      '--danger':'#dc2626','--link':'#5b7a9e','--link-soldout':'#475569',
      '--placeholder':'#999' },
  },
  midnight: {
    icon: 'moon-star', label: 'Midnight', description: 'Dunkelblau',
    vars: { '--bg':'#04040f','--surface':'#0d0d2b','--surface2':'#131340',
      '--surface3':'#1a1a55','--border':'#252570','--text':'#e8e8ff',
      '--muted':'#6666aa','--accent':'#00ffcc','--tour':'#ff6b9d',
      '--festival':'#ffd700','--tickets-color':'#00e5ff','--watch-color':'#ff9f43' },
  },
  forest: {
    icon: 'trees', label: 'Forest', description: 'Dunkelgrün',
    vars: { '--bg':'#060e08','--surface':'#0d1a0f','--surface2':'#132216',
      '--surface3':'#1a2e1e','--border':'#243828','--text':'#ddf0e0',
      '--muted':'#5a7a60','--accent':'#7dff6b','--tour':'#4dc8ff',
      '--festival':'#e87dff','--tickets-color':'#6bffb8','--watch-color':'#ffb84d' },
  },
  rose: {
    icon: 'flower-2', label: 'Rose', description: 'Hell-Rosa',
    vars: { '--bg':'#fff5f7','--surface':'#ffffff','--surface2':'#ffe8ed',
      '--surface3':'#ffd6de','--border':'#ffb3c1','--text':'#2d0010',
      '--muted':'#994466','--accent':'#c0003c','--tour':'#0050bb',
      '--festival':'#6600bb','--tickets-color':'#007a33','--watch-color':'#c05000' },
  },
  slate: {
    icon: 'gem', label: 'Slate', description: 'Blau-Grau',
    vars: { '--bg':'#0f1117','--surface':'#1a1d27','--surface2':'#22263a',
      '--surface3':'#2b304d','--border':'#343860','--text':'#e2e8f0',
      '--muted':'#64748b','--accent':'#f472b6','--tour':'#38bdf8',
      '--festival':'#a78bfa','--tickets-color':'#4ade80','--watch-color':'#fb923c' },
  },
};

// ── State ──────────────────────────────────────────────────────────────
let currentVars = {};  // key → hex value
let customCss = '';

// ── Init ───────────────────────────────────────────────────────────────
function init() {
  // Load from localStorage (shared with main app via same origin)
  const saved = JSON.parse(localStorage.getItem('kp-colors') || '{}');
  // Start from dark theme defaults, then apply saved overrides
  currentVars = { ...THEMES.dark.vars, ...saved };

  const savedCss = localStorage.getItem('kp-custom-css') || '';
  customCss = savedCss;
  document.getElementById('custom-css').value = savedCss;

  buildPresets();
  buildColorRows();
  applyToPreview();
}

function buildPresets() {
  document.getElementById('preset-grid').innerHTML = Object.entries(THEMES).map(([key, t]) =>
    `<button class="preset-btn" onclick="applyPreset('${key}')">
      <span class="preset-icon">${icon(t.icon)}</span>
      ${t.label}
    </button>`
  ).join('');
}

function buildColorRows() {
  document.getElementById('color-rows').innerHTML = COLOR_VARS.map(c => {
    const val = currentVars[c.key] || '#888888';
    return `<div class="color-row" id="row-${c.key.slice(2)}">
      <div class="color-preview" style="background:${val}" title="Klicken zum Ändern">
        <input type="color" value="${val}" oninput="onColorInput('${c.key}',this.value)"
          onchange="onColorInput('${c.key}',this.value)">
      </div>
      <div class="color-label">
        <div class="color-name">${c.label}</div>
        <div class="color-var">${c.key}</div>
      </div>
      <input class="color-hex" type="text" value="${val}" maxlength="9"
        oninput="onHexInput('${c.key}',this.value)"
        onblur="syncHexInput('${c.key}')">
    </div>`;
  }).join('');
}

function onColorInput(key, val) {
  currentVars[key] = val;
  // Update hex input
  const row = document.getElementById('row-' + key.slice(2));
  if (row) {
    row.querySelector('.color-hex').value = val;
    row.querySelector('.color-preview').style.background = val;
  }
  schedulePreviewUpdate();
}

function onHexInput(key, val) {
  // Accept #rrggbb and 3/6-digit without #
  let hex = val.trim();
  if (!hex.startsWith('#')) hex = '#' + hex;
  if (/^#[0-9a-fA-F]{6}$/.test(hex) || /^#[0-9a-fA-F]{3}$/.test(hex)) {
    currentVars[key] = hex;
    const row = document.getElementById('row-' + key.slice(2));
    if (row) {
      row.querySelector('input[type=color]').value = hex;
      row.querySelector('.color-preview').style.background = hex;
    }
    schedulePreviewUpdate();
  }
}

function syncHexInput(key) {
  const val = currentVars[key] || '#888888';
  const row = document.getElementById('row-' + key.slice(2));
  if (row) row.querySelector('.color-hex').value = val;
}

function applyPreset(key) {
  const theme = THEMES[key];
  if (!theme) return;
  currentVars = { ...theme.vars };
  buildColorRows();
  schedulePreviewUpdate();
  toast(`Theme „${theme.label}" angewendet`);
}

function onCustomCssChange() {
  customCss = document.getElementById('custom-css').value;
  schedulePreviewUpdate();
}

// ── Preview sync ───────────────────────────────────────────────────────
let _previewTimer = null;
function schedulePreviewUpdate() {
  clearTimeout(_previewTimer);
  _previewTimer = setTimeout(applyToPreview, 300);
}

function applyToPreview() {
  const frame = document.getElementById('preview-frame');
  try {
    const doc = frame.contentDocument || frame.contentWindow.document;
    // Inject or update a <style> tag with overrides
    let styleEl = doc.getElementById('design-tool-overrides');
    if (!styleEl) {
      styleEl = doc.createElement('style');
      styleEl.id = 'design-tool-overrides';
      doc.head.appendChild(styleEl);
    }
    const varsCSS = ':root {\n' +
      Object.entries(currentVars).map(([k,v]) => `  ${k}: ${v};`).join('\n') +
      '\n}\n' + customCss;
    styleEl.textContent = varsCSS;
  } catch(e) {
    // Cross-origin or not loaded yet — ignore
  }
}

function reloadPreview() {
  document.getElementById('preview-frame').src = '/';
  // Re-apply after reload
  setTimeout(() => {
    applyToPreview();
    toast('Vorschau neu geladen');
  }, 1500);
}

// ── Apply to main app (save to localStorage) ───────────────────────────
function applyToApp() {
  // Save to the same localStorage key that the main app reads
  localStorage.setItem('kp-colors', JSON.stringify(currentVars));
  localStorage.setItem('kp-custom-css', customCss);
  applyToPreview();
  // Also apply custom CSS live if iframe is accessible
  try {
    const frame = document.getElementById('preview-frame');
    const win = frame.contentWindow;
    // Reload the app so it picks up localStorage
    frame.src = '/';
    setTimeout(applyToPreview, 1500);
  } catch(e) {}
  toast(icon('check') + ' In App gespeichert');
}

// ── Export CSS ─────────────────────────────────────────────────────────
function buildCssString() {
  const lines = [
    '/* Konzertplaner Theme — generiert vom Design Tool */',
    ':root {',
    ...Object.entries(currentVars).map(([k,v]) => `  ${k}: ${v};`),
    '}',
  ];
  if (customCss.trim()) {
    lines.push('', '/* Eigenes CSS */', customCss);
  }
  return lines.join('\n');
}

function exportCss() {
  const css = buildCssString();
  const blob = new Blob([css], {type: 'text/css'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'konzertplaner-theme.css';
  a.click();
  URL.revokeObjectURL(a.href);
  toast(icon('download') + ' CSS heruntergeladen');
}

function copyToClipboard() {
  navigator.clipboard.writeText(buildCssString()).then(() => toast(icon('check') + ' CSS kopiert'));
}

function resetAll() {
  if (!confirm('Alle Design-Anpassungen zurücksetzen?')) return;
  localStorage.removeItem('kp-colors');
  localStorage.removeItem('kp-custom-css');
  currentVars = { ...THEMES.dark.vars };
  customCss = '';
  document.getElementById('custom-css').value = '';
  buildColorRows();
  applyToPreview();
  toast(icon('rotate-ccw') + ' Zurückgesetzt');
}

// ── Apply custom CSS from localStorage on app load ─────────────────────
// (The main app needs a small hook — see instructions below)

// ── Toast ──────────────────────────────────────────────────────────────
let _toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = msg;
  el.classList.add('visible');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('visible'), 2500);
}

// ── Preview iframe: wait for load before injecting ─────────────────────
document.getElementById('preview-frame').addEventListener('load', () => {
  setTimeout(applyToPreview, 200);
});

init();
</script>
</body>
