name: Konzertplaner
version: "0.1.0"
slug: konzertplaner
description: Lokaler Konzert- und Tourplaner (Flask + SQLite)
url: https://github.com/inollmann/konzertplaner
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  5000/tcp: 8069
ports_description:
  5000/tcp: Web-Oberfläche
webui: http://[HOST]:[PORT:5000]/
panel_icon: mdi:music-circle
panel_title: Konzertplaner
options:
  log_level: info
  database_url: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  database_url: str?
environment:
  KP_DEBUG: "0"
  PORT: "5000"
