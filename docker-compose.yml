services:
  konzertplaner:
    build: .
    ports:
      # To change the host port, modify the left number (HOST_PORT:CONTAINER_PORT)
      # Example: "8080:5000" to access the app at http://localhost:8080
      - "5000:5000"
    environment:
      # SQLite is the default: the database file lives in the mounted ./data
      # volume below. To use PostgreSQL instead, set DATABASE_URL to an
      # external server (this compose file ships no Postgres service), e.g.:
      #   DATABASE_URL: postgresql+psycopg://kp:kp@host:5432/kp
      KP_DEBUG: "0"
    volumes:
      # Read-write: holds the SQLite database (konzertplaner.db) plus the
      # legacy JSON files used for first-boot auto-migration.
      - ./data:/app/data
      # Dev: mount static/ so changes appear on page reload (no rebuild needed)
      - ./static:/app/static:ro
      # Read-only: .git so the app can read the running commit SHA
      - ./.git:/app/.git:ro
    restart: unless-stopped
